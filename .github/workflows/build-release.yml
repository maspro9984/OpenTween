# 自動ビルド & リリース（OpenTween / .NET Framework 4.8）
#
# 既存の build.yml / package.yml は成果物を「Artifact」に出すため MasUpdater からは見えない。
# このワークフローは develop への push で Release ビルドを作り、同梱の zip スクリプトで
# OpenTween.zip を作成して「GitHub Release」に添付する（MasUpdater が検知できるようにする）。
# タグは既存の版タグ(v3.x 等)と衝突しないよう build-<ビルド番号> を使う。
name: build-release

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ hashFiles('*/*.csproj') }}
          restore-keys: |
            nuget-

      - name: Build (Release)
        shell: pwsh
        run: msbuild /target:restore,build /p:Configuration=Release /p:DebugType=None /verbosity:minimal

      - name: Package (reproducible zip)
        shell: powershell
        run: |
          $binDir = '.\OpenTween\bin\Release\net48\'
          .\tools\build-zip-archive.ps1 -BinDir $binDir -DestPath 'OpenTween.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: |
            自動ビルド (commit ${{ github.sha }})
          files: OpenTween.zip
